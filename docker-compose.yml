services:

  mysql:
    image: mysql:8
    container_name: mysql-job_portal

    environment:
      MYSQL_ROOT_PASSWORD: revanth@1234
      MYSQL_DATABASE: job_portal

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jobportal-app

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy