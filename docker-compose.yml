services:

  # =========================
  # MYSQL
  # =========================

  mysql:
    image: mysql:8.0
    container_name: jobportal-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: job_portal

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - jobportal-network


  # =========================
  # REDIS
  # =========================

  redis:
    image: redis:7-alpine
    container_name: jobportal-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    networks:
      - jobportal-network


  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:3.9.1
    container_name: jobportal-kafka
    restart: unless-stopped

    ports:
      - "9093:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - jobportal-network


  # =========================
  # SPRING BOOT BACKEND
  # =========================

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile

    container_name: jobportal-backend
    restart: unless-stopped

    depends_on:
      - mysql
      - redis
      - kafka

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:mysql://mysql:3306/job_portal
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "8081:8081"

    volumes:
      - uploads_data:/app/uploads

    networks:
      - jobportal-network


  # =========================
  # REACT FRONTEND
  # =========================

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile

    container_name: jobportal-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - jobportal-network


# =========================
# VOLUMES
# =========================

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  uploads_data:


# =========================
# NETWORK
# =========================

networks:
  jobportal-network:
    driver: bridge