services:

  mysql:
    image: mysql:8
    container_name: mysql-jobportal

    environment:
      MYSQL_ROOT_PASSWORD: revanth@1234
      MYSQL_DATABASE: job_portal

    ports:
      - "3307:3306"

  redis:
    image: redis
    container_name: redis-jobportal

    ports:
      - "6379:6379"

  app:
    build: .
    container_name: jobportal-app

    ports:
      - "8080:8080"

    depends_on:
      - mysql
      - redis

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_portal
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: revanth@1234

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1