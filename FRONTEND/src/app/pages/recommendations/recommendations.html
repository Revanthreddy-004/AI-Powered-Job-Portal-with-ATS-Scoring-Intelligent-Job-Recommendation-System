<div class="container">

  <h1>
    Recommended Jobs
  </h1>

  <div
    *ngFor="let job of jobs"
    class="card">

    <h2>
      {{job.title}}
    </h2>

    <p>
      {{job.description}}
    </p>

    <p>
      Location :
      {{job.location}}
    </p>

    <p>
      Salary :
      {{job.salary}}
    </p>

  </div>

</div>
