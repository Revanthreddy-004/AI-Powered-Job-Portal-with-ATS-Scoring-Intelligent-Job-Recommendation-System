<div class="min-h-screen flex justify-center items-center bg-gray-100">

  <div class="bg-white p-8 rounded-xl shadow-lg w-96">

    <h1 class="text-3xl font-bold text-center mb-6">
      Register
    </h1>

    <input
      [(ngModel)]="name"
      type="text"
      placeholder="Full Name"
      class="w-full border-2 border-black p-4 rounded-xl mb-4"
    />

    <input
      [(ngModel)]="email"
      type="email"
      placeholder="Email"
      class="w-full border-2 border-black p-4 rounded-xl mb-4"
    />

    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password"
      class="w-full border-2 border-black p-4 rounded-xl mb-4"
    />

    <select
      [(ngModel)]="role"
      class="w-full border-2 border-black p-4 rounded-xl mb-4"
    >
      <option value="" disabled>
        Role
      </option>

      <option value="CANDIDATE">
        Candidate
      </option>

      <option value="RECRUITER">
        Recruiter
      </option>
    </select>

    <button
      (click)="register()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-semibold"
    >
      Register
    </button>

    <p class="text-center mt-4">
      Already have an account?

      <a
        routerLink="/login"
        class="text-blue-600 font-semibold"
      >
        Login
      </a>
    </p>

  </div>

</div>
